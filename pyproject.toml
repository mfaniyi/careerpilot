[project]
name = "careerpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Faniyi", email = "michaelfa@ha-shem.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agent-framework-core==1.20.0",
    "agent-framework-openai==1.16.0",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
careerpilot = "careerpilot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
